# Local development dependencies. All emulators run on localhost only.
name: thapsus-hr
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: thapsus_owner
      POSTGRES_PASSWORD: owner_dev_password
      POSTGRES_DB: thapsus
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=200", "-c", "work_mem=16MB"]
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./tools/docker/postgres-init:/docker-entrypoint-initdb.d:ro]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U thapsus_owner -d thapsus"], interval: 2s, timeout: 3s, retries: 30 }
  valkey:
    image: valkey/valkey:8-alpine
    ports: ["127.0.0.1:6379:6379"]
  s3:
    image: adobe/s3mock:latest
    environment: { COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: "thapsus-dev-files", COM_ADOBE_TESTING_S3MOCK_STORE_REGION: "eu-west-2" }
    ports: ["127.0.0.1:9090:9090"]
  sqs:
    image: softwaremill/elasticmq-native:latest
    ports: ["127.0.0.1:9324:9324", "127.0.0.1:9325:9325"]
  mail:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  pgdata: {}
