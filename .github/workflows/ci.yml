name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: thapsus_owner
          POSTGRES_PASSWORD: owner_dev_password
          POSTGRES_DB: thapsus
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U thapsus_owner -d thapsus" --health-interval 2s --health-timeout 3s --health-retries 30
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
      mail:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @thapsus/web exec playwright install --with-deps chromium
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - name: pnpm verify
        run: pnpm verify
        env:
          VERIFY_SKIP: deps
          CI: '1'
      - name: Verify summary
        if: always()
        run: cat .verify/summary.txt >> "$GITHUB_STEP_SUMMARY" || true
      # The CycloneDX SBOM of the shipped dependencies (written by the verify security step).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-cyclonedx
          path: .verify/sbom.cdx.json
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-logs
          path: |
            .verify/
            apps/web/playwright-report/
            apps/web/e2e/.results/
          retention-days: 14
